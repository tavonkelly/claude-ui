<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1f21; --muted: #5b6168; --line: #dcdcd6; --surface: #fff; --accent: #2f5bd3; --on-accent: #fff;
          --danger: #b3261e; --ok: #1e7a46; --ok-bg: #e3f2e9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161718; --fg: #e8e8e6; --muted: #a3a8ad; --line: #34363a; --surface: #1f2022; --accent: #8aa6f2; --on-accent: #0f1626;
            --danger: #f2948c; --ok: #7fd3a1; --ok-bg: #1d3327; color-scheme: dark; }
  }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 24px; }
  h1, h2 { font-weight: 600; margin: 0; }
  h1 { font-size: 24px; }
  h2 { font-size: 16px; }
  form { display: grid; gap: 24px; }
  section { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 24px; padding-top: 24px; border-top: 1px solid var(--line); }
  .controls { display: grid; gap: 16px; align-content: start; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
  .field { display: grid; gap: 4px; max-width: 320px; }
  .check { display: flex; gap: 8px; align-items: center; min-height: 24px; }
  select, button { font: inherit; }
  select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger.solid { background: var(--danger); color: var(--surface); }
  .cal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .cal .name { font-weight: 600; }
  .muted { color: var(--muted); }
  .chip { font-size: 14px; padding: 0 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); }
  .cal button { margin-left: auto; }
  .empty { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--muted); }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border: 1px solid var(--danger); border-radius: 6px; color: var(--danger); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 6px; }
  dialog { border: 1px solid var(--line); border-radius: 8px; padding: 24px; max-width: 360px; background: var(--surface); color: var(--fg); }
  dialog h2 { margin-bottom: 8px; }
  dialog p { margin: 0; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 600px) { section { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>

  <form id="prefs">
    <section aria-labelledby="h-notifications">
      <h2 id="h-notifications">Notifications</h2>
      <div class="controls">
        <fieldset>
          <legend>Email me when someone:</legend>
          <label class="check"><input type="checkbox" checked> Invites me</label>
          <label class="check"><input type="checkbox" checked> Changes an event</label>
          <label class="check"><input type="checkbox"> Cancels an event</label>
        </fieldset>
        <div class="field">
          <label for="reminder">Reminder:</label>
          <select id="reminder">
            <option>None</option>
            <option>5 min before</option>
            <option selected>15 min before</option>
            <option>1 hour before</option>
          </select>
        </div>
      </div>
    </section>

    <section aria-labelledby="h-region">
      <h2 id="h-region">Region</h2>
      <div class="controls">
        <div class="field">
          <label for="tz">Time zone:</label>
          <select id="tz">
            <option selected>Pacific Time (Los Angeles)</option>
            <option>Eastern Time (New York)</option>
            <option>Central European Time (Berlin)</option>
          </select>
        </div>
        <div class="field">
          <label for="week">Week starts on:</label>
          <select id="week">
            <option selected>Sunday</option>
            <option>Monday</option>
          </select>
        </div>
      </div>
    </section>

    <div class="banner" id="save-error" role="alert" hidden>
      <span>Couldn't save changes</span>
      <button type="button" id="retry">Try again</button>
    </div>
    <div><button type="submit" class="primary" id="save">Save changes</button></div>
  </form>

  <section aria-labelledby="h-calendars">
    <h2 id="h-calendars">Connected calendars</h2>
    <div class="controls" id="calendars">
      <div class="cal">
        <span class="name">Google Calendar</span>
        <span class="muted">work@example.com</span>
        <span class="chip">Synced 2 min ago</span>
        <button type="button" aria-label="Disconnect Google Calendar" id="disconnect">Disconnect</button>
      </div>
    </div>
    <template id="calendars-empty">
      <div class="empty">
        <span>No calendars connected</span>
        <button type="button">Connect calendar</button>
      </div>
    </template>
  </section>

  <section aria-labelledby="h-account">
    <h2 id="h-account">Account</h2>
    <div class="controls"><div><button type="button" class="danger" id="delete">Delete account</button></div></div>
  </section>
</main>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Delete account?</h2>
  <p>Deletes 214 events and 1 connected calendar. This cannot be undone.</p>
  <div class="actions">
    <button type="button" id="cancel">Cancel</button>
    <button type="button" class="danger solid" id="confirm-delete">Delete account</button>
  </div>
</dialog>

<script>
  const $ = (id) => document.getElementById(id);
  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = text;
    document.body.append(t);
    setTimeout(() => t.remove(), 2500);
  }
  $('prefs').addEventListener('submit', (e) => {
    e.preventDefault();
    $('save-error').hidden = true;
    $('save').textContent = 'Saving…';
    setTimeout(() => { $('save').textContent = 'Save changes'; toast('Changes saved'); }, 600);
  });
  $('retry').addEventListener('click', () => $('prefs').requestSubmit());
  $('disconnect').addEventListener('click', () => {
    $('calendars').replaceChildren($('calendars-empty').content.cloneNode(true));
    toast('Google Calendar disconnected');
  });
  $('delete').addEventListener('click', () => $('confirm').showModal());
  $('cancel').addEventListener('click', () => $('confirm').close());
  $('confirm-delete').addEventListener('click', () => { $('confirm').close(); toast('Account deleted'); });
</script>
</body>
</html>
