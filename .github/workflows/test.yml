name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python skills/ui-text/bin/ui-standards selftest
      - run: python skills/ui-text/tests/test_hooks.py
      - run: python skills/ui-text/tests/test_render.py
      - run: python skills/ui-text/bin/ui-standards check examples
